<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Data Setoran — Biovert</title><link rel="stylesheet" href="styles.css"></head><body data-page="input"><div id="site-header"></div><main class="container page narrow-page"><div class="page-title"><div><p class="eyebrow">INTERNAL CYCLO</p><h1>Input Data Setoran</h1></div><button id="logout" class="btn secondary">Keluar</button></div><div id="login-box" class="panel form"><h2>Masuk ke panel internal</h2><label>Username<input id="login-user" autocomplete="username"></label><label>Password<input id="login-pass" type="password" autocomplete="current-password"></label><small id="login-error" class="error"></small><button id="login-btn" class="btn primary">Masuk</button><p class="hint">Demo mockup: cyclo / biovert2026</p></div><div id="input-app" class="hidden"><form id="deposit-form" class="panel form"><input type="hidden" name="id"><label>Pilih Pedagang<select name="partner" id="partner-select" required></select></label><label>Tanggal Setoran<input name="date" type="date" required></label><label>Berat Sampah (kg)<input name="kg" type="number" min="0.1" step="0.1" required></label><label>Kerapian Pemilahan<select name="quality"><option value="1.5">Rapi</option><option value="1">Cukup Rapi</option><option value="0.5">Kurang Rapi</option></select></label><label>Catatan<textarea name="note"></textarea></label><small id="deposit-error" class="error"></small><button class="btn primary">Simpan Data Setoran</button></form><section class="section"><h2>Riwayat input hari ini</h2><div class="table-wrap"><table><thead><tr><th>Pedagang</th><th>Kg</th><th>Poin</th><th>Aksi</th></tr></thead><tbody id="today-entries"></tbody></table></div></section></div></main><div id="site-footer"></div><script src="app.js"></script></body></html>
